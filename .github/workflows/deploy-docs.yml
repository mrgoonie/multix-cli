name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      # The landing page lists providers and models read from these at build time.
      - "src/capabilities/**"
      - "src/providers/**"
      - "src/core/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push supersedes a queued one. Runs
# from other refs get their own group so they cannot cancel a queued main
# deploy (the production environment rejects them anyway).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-docs' || format('deploy-docs-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (multix.zuey.me)
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the production environment, which only
    # main may use; runs from other refs get no token.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs-site

      # `deploy` runs verify (astro check, build, tests) before `wrangler deploy`.
      - name: Verify and deploy
        run: npm run deploy --prefix docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
