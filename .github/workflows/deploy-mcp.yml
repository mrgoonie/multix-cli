name: Deploy MCP server

# Deploys worker/ (the remote MCP server at multix.zuey.me/mcp) and builds and
# pushes its job container image. The image is built from this repository's
# CLI source, so CLI changes redeploy it too. Worker secrets (GitHub OAuth,
# SESSION_SECRET, SECRETS_ENCRYPTION_KEY, MULTIX_ALLOWED_USERS) are set once
# with `wrangler secret put` and are not touched here.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsup.config.ts"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (multix.zuey.me/mcp)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # The catalog and argv tests load the CLI's own commander tree from src/.
      - name: Install CLI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Type check, test and bundle check
        run: |
          npm run typecheck --prefix worker
          npm test --prefix worker
          npm run check:bundle --prefix worker

      # wrangler builds worker/container/Dockerfile with the runner's Docker and
      # pushes it to the Cloudflare registry before rolling out the Worker.
      - name: Deploy
        run: npm run deploy --prefix worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
