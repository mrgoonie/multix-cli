name: Deploy MCP server

# Builds the job container image and rolls it out first, then deploys worker/
# (the remote MCP server at multix.zuey.me/mcp). The image is built from this repository's
# CLI source, so CLI changes redeploy it too. Worker secrets (GitHub OAuth,
# SESSION_SECRET, SECRETS_ENCRYPTION_KEY, MULTIX_ALLOWED_USERS) are set once
# with `wrangler secret put` and are not touched here.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsup.config.ts"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:
    inputs:
      apply_container_settings:
        description: Apply container settings from wrangler.jsonc (instance type, max_instances) even if they look unchanged. Starts a second rollout of the same image after the Worker.
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once; a newer push supersedes a queued one. Runs
# from other refs get their own group so they cannot cancel a queued main
# deploy (the production environment rejects them anyway).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-mcp' || format('deploy-mcp-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (multix.zuey.me/mcp)
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the production environment, which only
    # main may use; runs from other refs get no token.
    environment: production
    timeout-minutes: 60

    steps:
      # Manual runs can be started from any branch; production only takes main.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main (this run is on ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # The catalog and argv tests load the CLI's own commander tree from src/.
      - name: Install CLI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Type check, test and bundle check
        run: |
          npm run typecheck --prefix worker
          npm test --prefix worker
          npm run check:bundle --prefix worker

      # Container first: `wrangler deploy` alone activates the Worker before its
      # container rollout, so a new Worker could send jobs to old containers.
      # This builds and pushes the image, rolls it out to every instance and waits;
      # if the rollout fails, the Worker is not deployed.
      - name: Roll out the job container
        id: container
        run: node worker/scripts/roll-out-job-container.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --containers-rollout=none: the image is already live, and wrangler would
      # otherwise roll the same image out a second time. The Worker version only
      # records the container's name and class, not its image. When the rollout
      # step finds that wrangler.jsonc's container settings (instance type,
      # max_instances) differ from the live application, wrangler applies them
      # with a gradual rollout of the same image instead.
      - name: Deploy the Worker
        run: npm run deploy --prefix worker -- --containers-rollout=${{ (inputs.apply_container_settings || steps.container.outputs.settings_changed == 'true') && 'gradual' || 'none' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
