name: Release Please (beta)

on:
  push:
    branches: [dev]

permissions:
  actions: write
  contents: write
  pull-requests: write

# Beta releases are prepared from dev. release-please opens/updates a Release PR
# that bumps package.json/package-lock/CHANGELOG.md/skill metadata from
# conventional commits and creates prerelease tags such as v0.1.0-beta.1.
jobs:
  release-please-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: dev
          config-file: release-please-beta-config.json
          manifest-file: .release-please-manifest.json

      # npm accepts an OIDC trusted-publishing upload only from the workflow file
      # registered on npmjs.com, which is publish.yml, so hand the new tag to it
      # instead of publishing here. GITHUB_TOKEN may trigger workflow_dispatch.
      - name: Publish beta to npm via publish.yml
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME" -f tag=beta
