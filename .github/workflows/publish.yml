name: Publish (npm + GitHub Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g. latest, next)"
        required: false
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating GitHub releases
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          MULTIX_DISABLE_HOME_ENV: "1"

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        env:
          REQUESTED_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          if [ -n "$REQUESTED_DIST_TAG" ]; then
            TAG="$REQUESTED_DIST_TAG"
          else
            VERSION="$(node -p "require('./package.json').version")"
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="${VERSION#*-}"
              TAG="${PRERELEASE%%.*}"
            else
              TAG="latest"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing npm dist-tag: $TAG"

      - name: Publish to npm
        # Trusted publishing (OIDC): npm >= 11.5.1, no NPM_TOKEN.
        run: |
          npm install -g npm@latest
          npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"
      # GitHub Release is created by release-please-action when a Release PR
      # merges. Manual `workflow_dispatch` runs publish only to npm.
